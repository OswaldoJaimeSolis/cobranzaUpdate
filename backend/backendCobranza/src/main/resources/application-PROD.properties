# Perfil de producción (EC2). Se activa con --spring.profiles.active=PROD (ver deploy/cobranza.service).
# Las credenciales y secretos NO van aquí: llegan como variables de entorno desde
# /etc/cobranza/cobranza.env (ver deploy/cobranza.env.example).
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/jalpagob_cobranza?useSSL=false&allowPublicKeyRetrieval=true&preserveInstants=false
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_PASSWORD}

# El esquema se carga con el respaldo de la base; Hibernate sólo agrega lo que falte
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

seguridad.jwt.secreto=${JWT_SECRETO}
seguridad.cors.origenes=${CORS_ORIGENES:http://18.190.32.174}
seguridad.admin-inicial.password=${ADMIN_PASSWORD}
