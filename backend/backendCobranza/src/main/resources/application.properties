# Kept explicit so the dialect does not depend on JDBC metadata auto-detection
# (this server rejects part of Hibernate's metadata probe). Hibernate 6 logs
# HHH90000025 about it; that warning is expected and harmless.
spring.jpa.database=mysql
spring.jpa.show-sql=true
# Local dev: no migrations checked in, so let Hibernate create/update the schema
# against the local database instead of hand-running DDL.
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
!spring.datasource.url=jdbc:mysql://jalpa.gob.mx:3306/jalpagob_cobranza
spring.datasource.url=jdbc:mysql://localhost/jalpagob_cobranza
spring.datasource.username=oswaldo_dev
spring.datasource.password=devI

spring.cache.type=NONE
spring.jmx.default-domain=cobranzaPlaza
!spring.datasource.username=jalpagob_cobranza_rastro_d
!spring.datasource.url=jdbc:mysql://jalpa.gob.mx:3306/jalpagob_cobranza_rastro


# Seguridad (JWT). En producción defina JWT_SECRETO (al menos 32 caracteres) y cambie la
# contraseña del administrador inicial, que se crea sólo si la tabla usuario está vacía.
seguridad.jwt.secreto=${JWT_SECRETO:secreto-local-de-desarrollo-cambiar-en-produccion}
seguridad.jwt.horas-web=8
seguridad.jwt.horas-movil=12
seguridad.cors.origenes=${CORS_ORIGENES:http://localhost:4200}
seguridad.admin-inicial.usuario=admin
seguridad.admin-inicial.password=${ADMIN_PASSWORD:admin123}
# false = API abierta mientras se actualizan la web y los equipos móviles
seguridad.exigir-autenticacion=true
