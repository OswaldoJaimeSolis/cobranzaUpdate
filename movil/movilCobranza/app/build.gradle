apply plugin: 'com.android.application'

android {
    namespace = 'com.jalpa.cobranza'
    // Se compila contra la última plataforma estable...
    compileSdk = 36

    defaultConfig {
        applicationId = "com.jalpa.cobroplazas"
        minSdk = 26
        // ...pero targetSdk se queda en 35: en 36 deja de poder desactivarse la
        // imposición de "edge to edge" (ver res/values-v35/styles.xml) y los layouts
        // heredados de esta app no aplican window insets. Subir a 36 requiere revisar
        // cada Activity antes.
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
        // Backend al que se conecta la app. Por omisión, producción (EC2); para desarrollo:
        //   ./gradlew installDebug -PservidorUrl=http://192.168.1.103:8080/
        // La IP debe estar también en res/xml/network_security_config.xml (HTTP sin TLS).
        buildConfigField "String", "SERVIDOR_URL", "\"${project.findProperty('servidorUrl') ?: 'http://18.190.32.174:8083/'}\""
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }
    packaging {
        // The vendor Bixolon / JavaPOS / ICU / Xerces jars in app/libs ship duplicated
        // licence and metadata entries that the modern packager refuses by default.
        resources {
            excludes += [
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/DEPENDENCIES',
                    'META-INF/*.kotlin_module',
                    'META-INF/INDEX.LIST',
                    'license/**',
                    'README*'
            ]
            pickFirsts += ['**/*.properties']
        }
    }
    lint {
        // Keep `./gradlew lint` informative without failing on this legacy code base.
        abortOnError = false
    }
}

dependencies {
    def room_version = "2.8.5"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    // verificación local del hash BCrypt de la contraseña del recaudador (login sin conexión)
    implementation 'org.mindrot:jbcrypt:0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Barcode/QR scanning (ScanActivity): CameraX supplies the camera frames, MLKit's
    // on-device barcode scanner reads them. Replaces the deprecated Play Services
    // Vision API (com.google.android.gms:play-services-vision), which Google no longer
    // updates and which is not available for new integrations.
    def camerax_version = "1.6.2"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-base:18.11.0'

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.zxing:core:3.5.4'
}
