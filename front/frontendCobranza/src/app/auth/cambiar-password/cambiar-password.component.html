<h2 mat-dialog-title>Cambiar contraseña</h2>

<mat-dialog-content>
  <div class="columns-container">
    <mat-form-field>
      <input matInput placeholder="Contraseña actual" type="password" [(ngModel)]="actual" autocomplete="current-password">
    </mat-form-field>
    <mat-form-field>
      <input matInput placeholder="Contraseña nueva" type="password" [(ngModel)]="nueva" autocomplete="new-password">
    </mat-form-field>
    <mat-form-field>
      <input matInput placeholder="Confirmar contraseña nueva" type="password" [(ngModel)]="confirmacion"
        autocomplete="new-password">
    </mat-form-field>
    @if (error) {
      <div class="error">{{error}}</div>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="dialogRef.close()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
