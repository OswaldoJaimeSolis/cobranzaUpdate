<h2 mat-dialog-title>Cambiar contraseña</h2>

<form (ngSubmit)="guardar()">
  <mat-dialog-content>
    <div class="form-grid form-grid--una">
      <mat-form-field appearance="outline">
        <mat-label>Contraseña actual</mat-label>
        <input matInput name="actual" type="password" [(ngModel)]="actual" autocomplete="current-password" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contraseña nueva</mat-label>
        <input matInput name="nueva" type="password" [(ngModel)]="nueva" autocomplete="new-password" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Confirmar contraseña nueva</mat-label>
        <input matInput name="confirmacion" type="password" [(ngModel)]="confirmacion" autocomplete="new-password"
          required>
      </mat-form-field>
      @if (error) {
        <div class="texto-error" role="alert">
          <mat-icon aria-hidden="true">error</mat-icon><span>{{error}}</span>
        </div>
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button type="button" (click)="dialogRef.close()">Cancelar</button>
    <button mat-flat-button type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
