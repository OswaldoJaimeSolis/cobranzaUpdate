<h2 mat-dialog-title>Seleccionar contribuyente</h2>
<mat-dialog-content>
  <div class="filtros barra-busqueda">
    <mat-form-field appearance="outline" class="campo-busqueda" subscriptSizing="dynamic">
      <mat-label>Buscar</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput #busqueda (keyup)="applyFilter(busqueda.value)" (keydown.enter)="seleccionarPrimero()"
        placeholder="Código, nombre o apellidos" cdkFocusInitial>
    </mat-form-field>
    <button mat-stroked-button type="button" (click)="openAddContribuyente()">
      <mat-icon>add</mat-icon> Nuevo contribuyente
    </button>
  </div>
  <p class="nota">Haga clic en un renglón o selecciónelo con el teclado y presione Enter.</p>
  <div class="tabla-contenedor tabla-busqueda">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let element">{{element.codigoContribuyente}}</td>
      </ng-container>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element">{{element.nombre}}</td>
      </ng-container>
      <ng-container matColumnDef="apePaterno">
        <th mat-header-cell *matHeaderCellDef>Apellido paterno</th>
        <td mat-cell *matCellDef="let element">{{element.apePaterno}}</td>
      </ng-container>
      <ng-container matColumnDef="apeMaterno">
        <th mat-header-cell *matHeaderCellDef>Apellido materno</th>
        <td mat-cell *matCellDef="let element">{{element.apeMaterno}}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="fila-seleccionable" tabindex="0"
        role="button" [attr.aria-label]="'Seleccionar contribuyente ' + etiqueta(row)"
        (click)="selectRow(row)" (keydown.enter)="selectRow(row)" (keydown.space)="selectRow(row); $event.preventDefault()"></tr>
      <tr class="mat-mdc-row" *matNoDataRow>
        <td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">
          <app-empty-state icono="search_off" texto="Sin resultados"></app-empty-state>
        </td>
      </tr>
    </table>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
