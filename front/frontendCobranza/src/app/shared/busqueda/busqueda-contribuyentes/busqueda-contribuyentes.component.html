<h2 mat-dialog-title class="centerText">Contribuyentes</h2>
<div class="centerTitle">
  <button mat-fab color="primary" (click)="openAddContribuyente()">
    <mat-icon mat-list-icon>add</mat-icon>
  </button>
</div>
<mat-dialog-content>
  <mat-form-field>
    <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Búsqueda">
  </mat-form-field>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->



    <!-- Position Column -->
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef> Código </th>
      <td mat-cell *matCellDef="let element"> {{element.codigoContibuyente}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
    </ng-container>
    <ng-container matColumnDef="apePaterno">
      <th mat-header-cell *matHeaderCellDef> A. Paterno </th>
      <td mat-cell *matCellDef="let element"> {{element.apePaterno}} </td>
    </ng-container>
    <ng-container matColumnDef="apeMaterno">
      <th mat-header-cell *matHeaderCellDef> A. Materno </th>
      <td mat-cell *matCellDef="let element"> {{element.apeMaterno}} </td>
    </ng-container>



    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectRow(row)"></tr>
  </table>
</mat-dialog-content>
