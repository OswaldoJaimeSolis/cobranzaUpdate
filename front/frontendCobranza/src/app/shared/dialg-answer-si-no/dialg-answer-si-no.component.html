<div class="confirmacion">
  <h2 mat-dialog-title class="confirmacion__titulo">
    <mat-icon class="confirmacion__icono" [class.confirmacion__icono--error]="destructivo" aria-hidden="true">
      {{destructivo ? 'delete' : 'help'}}
    </mat-icon>
    <span>{{title}}</span>
  </h2>
  <mat-dialog-content>
    <p class="confirmacion__texto">{{message}}</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button type="button" (click)="cancelar()" cdkFocusInitial>{{textoCancelar}}</button>
    <button mat-flat-button type="button" [class.boton-destructivo]="destructivo" (click)="aceptar()">
      {{textoAceptar}}
    </button>
  </mat-dialog-actions>
</div>
