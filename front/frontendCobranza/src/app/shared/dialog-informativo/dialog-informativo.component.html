<div class="mensaje" [class]="'mensaje--' + tipo">
  <h2 mat-dialog-title class="mensaje__titulo">
    <mat-icon class="mensaje__icono" aria-hidden="true">{{icono}}</mat-icon>
    <span>{{title}}</span>
  </h2>
  <mat-dialog-content>
    <p class="mensaje__texto">{{message}}</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-flat-button type="button" (click)="close()" cdkFocusInitial>Aceptar</button>
  </mat-dialog-actions>
</div>
