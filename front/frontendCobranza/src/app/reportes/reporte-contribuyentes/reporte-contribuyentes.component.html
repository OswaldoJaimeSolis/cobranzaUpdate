<div class="page">
  <app-page-header titulo="Reporte de contribuyentes" subtitulo="Contribuyentes y sus plazas, por tipo de plaza">
  </app-page-header>

  <section class="panel" aria-labelledby="titulo-filtros">
    <h2 class="panel__titulo" id="titulo-filtros">Filtros</h2>
    <div class="filtros">
      <mat-checkbox name="todosTP" [(ngModel)]="todosTP">Todos los tipos de plaza</mat-checkbox>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Tipo de plaza</mat-label>
        <input name="codigoTipoPlaza" matInput [(ngModel)]="tipoPlaza.codigoTipoPlaza" readonly
          [disabled]="todosTP" required (click)="buscarTipoPlaza()">
        <button mat-icon-button matSuffix type="button" (click)="buscarTipoPlaza()" [disabled]="todosTP"
          aria-label="Buscar tipo de plaza" matTooltip="Buscar tipo de plaza">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </section>

  <section class="panel" aria-labelledby="titulo-generar">
    <h2 class="panel__titulo" id="titulo-generar">Generar</h2>
    <div class="acciones-barra">
      <button mat-flat-button [disabled]="isLoading" (click)="recuperaReporte(1)">
        <mat-icon>picture_as_pdf</mat-icon> Reporte PDF
      </button>
      <button mat-stroked-button [disabled]="isLoading" (click)="recuperaReporte(2)">
        <mat-icon>table_view</mat-icon> Reporte Excel (XLS)
      </button>
    </div>
    @if (isLoading) {
      <mat-progress-bar class="barra-reporte" mode="indeterminate" aria-label="Generando reporte"></mat-progress-bar>
    }
  </section>
</div>
