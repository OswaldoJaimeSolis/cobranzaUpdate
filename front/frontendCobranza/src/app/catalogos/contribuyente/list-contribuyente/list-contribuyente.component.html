<div class="page">
  <app-page-header titulo="Contribuyentes" subtitulo="Personas registradas como propietarias de plazas">
    <button mat-flat-button (click)="openDialog()">
      <mat-icon>add</mat-icon> Nuevo contribuyente
    </button>
  </app-page-header>

  <div class="filtros">
    <mat-form-field appearance="outline" class="campo-busqueda" subscriptSizing="dynamic">
      <mat-label>Buscar</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="stringBusqueda" (ngModelChange)="filtrar()"
        placeholder="Código, nombre o apellidos">
      @if (stringBusqueda) {
        <button mat-icon-button matSuffix (click)="stringBusqueda = ''; filtrar()" aria-label="Limpiar búsqueda"
          matTooltip="Limpiar búsqueda">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  </div>

  <div class="tabla-contenedor">
    @if (isLoading) {
      <mat-progress-bar mode="indeterminate" aria-label="Cargando contribuyentes"></mat-progress-bar>
    }
    @if (!displayOrNot) {
      <div class="tabla-scroll">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="codigo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
            <td mat-cell *matCellDef="let con">{{con.codigoContribuyente}}</td>
          </ng-container>
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let con">{{con.nombre}} {{con.apePaterno}} {{con.apeMaterno}}</td>
          </ng-container>
          <ng-container matColumnDef="rfc">
            <th mat-header-cell class="ocultar-movil" *matHeaderCellDef mat-sort-header>RFC</th>
            <td mat-cell class="ocultar-movil celda-secundaria" *matCellDef="let con">{{con.rfcContribuyente}}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef><span class="cdk-visually-hidden">Acciones</span></th>
            <td mat-cell *matCellDef="let con">
              <button mat-icon-button (click)="openDialogEdit(con)" matTooltip="Editar"
                [attr.aria-label]="'Editar contribuyente ' + con.codigoContribuyente">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="boton-eliminar" (click)="deleteContribuyente(con.codigoContribuyente)"
                matTooltip="Eliminar" [attr.aria-label]="'Eliminar contribuyente ' + con.codigoContribuyente">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell" [attr.colspan]="columnas.length">
              <app-empty-state icono="search_off" texto="No hay contribuyentes que coincidan con la búsqueda">
              </app-empty-state>
            </td>
          </tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[25, 50, 100]" [pageSize]="25" showFirstLastButtons
        aria-label="Páginas de contribuyentes"></mat-paginator>
    } @else if (!isLoading) {
      <app-empty-state icono="people" texto="No hay contribuyentes"></app-empty-state>
    }
  </div>
</div>
