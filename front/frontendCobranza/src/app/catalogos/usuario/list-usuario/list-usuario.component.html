<mat-list>
  <div class="add-btn">
    <button mat-fab color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="centerTitle">
    <h2>Usuarios</h2>
  </div>
  @for (o of usuarios; track o.usuario) {
    <mat-list-item>
      <mat-icon matListItemIcon>{{o.activo ? 'person' : 'person_off'}}</mat-icon>
      <span matListItemTitle>{{o.usuario}} — {{o.nombre}}</span>
      <span matListItemLine>{{nombreRol(o.rol)}}{{o.activo ? '' : ' (inactivo)'}}</span>
      <div matListItemMeta>
        <button mat-mini-fab color="primary" (click)="openDialog(o)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-mini-fab color="primary" (click)="deleteUsuario(o.usuario)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </mat-list-item>
    <mat-divider></mat-divider>
  }
</mat-list>

<div class="container">
  @if (isLoading) {
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  }
</div>
