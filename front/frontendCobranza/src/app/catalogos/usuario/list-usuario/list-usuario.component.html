<div class="page">
  <app-page-header titulo="Usuarios" subtitulo="Cuentas con acceso a esta aplicación web">
    <button mat-flat-button (click)="openDialog()">
      <mat-icon>add</mat-icon> Nuevo usuario
    </button>
  </app-page-header>

  <div class="tabla-contenedor">
    @if (isLoading) {
      <mat-progress-bar mode="indeterminate" aria-label="Cargando usuarios"></mat-progress-bar>
    }
    @if (usuarios.length > 0) {
      <div class="tabla-scroll">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="usuario">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
            <td mat-cell *matCellDef="let o">{{o.usuario}}</td>
          </ng-container>
          <ng-container matColumnDef="nombre">
            <th mat-header-cell class="ocultar-movil" *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell class="ocultar-movil" *matCellDef="let o">{{o.nombre}}</td>
          </ng-container>
          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
            <td mat-cell *matCellDef="let o">{{nombreRol(o.rol)}}</td>
          </ng-container>
          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let o">
              @if (o.activo) {
                <span class="estado estado--activo"><mat-icon aria-hidden="true">check_circle</mat-icon>Activo</span>
              } @else {
                <span class="estado estado--inactivo"><mat-icon aria-hidden="true">person_off</mat-icon>Inactivo</span>
              }
            </td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef><span class="cdk-visually-hidden">Acciones</span></th>
            <td mat-cell *matCellDef="let o">
              <button mat-icon-button (click)="openDialog(o)" matTooltip="Editar"
                [attr.aria-label]="'Editar usuario ' + o.usuario">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="boton-eliminar" (click)="deleteUsuario(o.usuario)" matTooltip="Eliminar"
                [attr.aria-label]="'Eliminar usuario ' + o.usuario">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
        </table>
      </div>
    } @else if (!isLoading) {
      <app-empty-state icono="manage_accounts" texto="No hay usuarios"></app-empty-state>
    }
  </div>
</div>
