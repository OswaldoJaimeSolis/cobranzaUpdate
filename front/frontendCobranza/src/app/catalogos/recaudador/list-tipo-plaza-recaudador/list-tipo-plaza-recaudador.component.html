<h2 mat-dialog-title>Tipos de plaza asignados</h2>
<mat-dialog-content>
  <p class="dialog-subtitulo">{{recaudador.codigoRecaudador}} · {{recaudador.nombreRecaudador}}</p>
  <div class="acciones-barra barra-superior">
    <button mat-stroked-button type="button" (click)="openDialogAdd()">
      <mat-icon>add</mat-icon> Asignar tipo de plaza
    </button>
  </div>
  @if (displayOrNot) {
    <app-empty-state icono="category" texto="No hay plazas asignadas"></app-empty-state>
  } @else {
    <div class="tabla-contenedor">
      <table mat-table [dataSource]="tpsRecaudador">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let o">{{o.tipoPlaza.codigoTipoPlaza}}</td>
        </ng-container>
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let o">{{o.tipoPlaza.descripcionTipoPlaza}}</td>
        </ng-container>
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef><span class="cdk-visually-hidden">Acciones</span></th>
          <td mat-cell *matCellDef="let o">
            <button mat-icon-button class="boton-eliminar" (click)="deleteO(o.idRecaudadorTipoPlaza)"
              matTooltip="Quitar" [attr.aria-label]="'Quitar tipo de plaza ' + o.tipoPlaza.codigoTipoPlaza">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
      </table>
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button type="button" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
