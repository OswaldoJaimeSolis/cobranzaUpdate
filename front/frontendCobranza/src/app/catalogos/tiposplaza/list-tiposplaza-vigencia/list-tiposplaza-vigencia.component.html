<mat-list>


  <div class="centerTitle">
    <h2>{{tipoPlaza.descripcionTipoPlaza}}</h2>
    <h3>Vigencias </h3>
  </div>
  <div class="centerTitle">
    <button mat-fab color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  @if (displayOrNot) {
    <h2 mat-subheader>No hay períodos</h2>
  } @else {
    @for (o of vigencias; track o) {
      <mat-list-item>
        <mat-icon matListItemIcon>watch_later</mat-icon>
        <span matListItemTitle>De {{o.vigenciaInicial|date: 'dd/MM/yyyy'}} al {{o.vigenciaFinal|date: 'dd/MM/yyyy'}} Importe:
        {{o.importe }}</span>
        <div matListItemMeta>
          <button mat-raised-button color="primary" (click)="deleteO(o.idTipoPlazaVigencia)">
            Eliminar
          </button>
        </div>
      </mat-list-item>
      <mat-divider></mat-divider>
    }
  }



</mat-list>
<div class="container">
  @if (isLoading) {
    <mat-progress-spinner mode="indeterminate"  ></mat-progress-spinner>
  }
</div>
