<h2 mat-dialog-title class="centerText">{{encabezado}} </h2>

<mat-dialog-content>

  <div class="columns-container">

    <mat-form-field>
      <input matInput placeholder="Tipo plaza: " [(ngModel)]="oFinal.tipoPlaza.codigoTipoPlaza" #data="ngModel"
        disabled=true readonly=true required>
    </mat-form-field>
    <!--<mat-form-field>
      <input matInput placeholder="Id: " [(ngModel)]="oFinal.idTipoPlazaVigencia" #data="ngModel" disabled=true
        readonly=true>
        
    </mat-form-field>
    -->
    <mat-form-field>
      <input matInput [matDatepicker]="picker1" placeholder="Fecha inicial" [(ngModel)]="oFinal.vigenciaInicial"
        >
      <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
    <!--<mat-form-field style="margin-left: 10px">
      <input matInput [matDatepicker]="picker2" placeholder="Fecha final" [(ngModel)]="oFinal.vigenciaFinal">
      <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>
    -->
    <mat-form-field style="text-align: right">
      <input matInput placeholder="Importe: " [(ngModel)]="oFinal.importe" #data="ngModel" inputmode="numeric" required>
    </mat-form-field>


  </div>

</mat-dialog-content>

<mat-dialog-actions class="centerContent" >
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="validarPeriodo(oFinal)">Save</button>
</mat-dialog-actions>
