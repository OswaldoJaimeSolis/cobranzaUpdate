<h2 mat-dialog-title>{{editarId ? 'Editar período' : 'Nuevo período'}}</h2>

<mat-dialog-content>
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Tipo de plaza</mat-label>
      <input matInput [(ngModel)]="oFinal.tipoPlaza.codigoTipoPlaza" disabled readonly>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha inicial</mat-label>
      <input matInput [matDatepicker]="picker1" [(ngModel)]="oFinal.vigenciaInicial">
      <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Precio normal</mat-label>
      <input matInput class="numero" [(ngModel)]="oFinal.importe" inputmode="decimal" required>
      <mat-error>Capture el precio normal</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Precio con descuento</mat-label>
      <input matInput class="numero" [(ngModel)]="oFinal.precioDescuento" inputmode="decimal">
      <mat-hint>Opcional</mat-hint>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button type="button" (click)="onCancel()">Cancelar</button>
  <button mat-flat-button type="button" (click)="validarPeriodo(oFinal)">Guardar</button>
</mat-dialog-actions>
